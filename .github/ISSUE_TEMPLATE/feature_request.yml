name: Sugerir um recurso
description: Uma ideia para melhorar o app.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve
      description: Conte a situação em que você sente falta do recurso.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Como você imagina
      description: Descreva o comportamento desejado. Esboços e referências ajudam.
    validations:
      required: true
