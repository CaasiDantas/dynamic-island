[package]
name = "dynamic-island"
version = "0.5.0"
description = "Dynamic Island para Windows"
authors = ["Isaac Dantas"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dynamic_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Abrir o app de novo (ex.: atalho) só mostra a ilha que já está rodando.
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
# Seletor de pasta nativo (perguntar ao Claude sobre o código de uma pasta).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Leitura direta do cursor (GetCursorPos) sem passar pela thread principal da janela.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Performance", "Win32_Storage_FileSystem", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis"] }
# Mídia do sistema (SMTC) e sinais para as pílulas (volume/saída de áudio, energia, Caps Lock).
windows = { version = "0.62", features = [
  "Foundation", "Media_Control", "Storage_Streams",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
  "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem", "Win32_System_Power", "Win32_UI_Input_KeyboardAndMouse",
  # Notificações dos outros apps (central de notificações do Windows).
  "UI_Notifications", "UI_Notifications_Management", "ApplicationModel", "Foundation_Collections",
  # Atalhos de aplicativos: ícone pelo Shell e abrir pelo ShellExecute.
  "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
