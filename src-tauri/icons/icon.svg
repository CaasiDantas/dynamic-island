<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c22"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#6d5bff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#2f6bff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a4c"/>
      <stop offset="0.55" stop-color="#ff3d77"/>
      <stop offset="1" stop-color="#8b5cff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9c3ff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#glow)"/>
  <rect x="65" y="65" width="894" height="894" rx="207" fill="none" stroke="url(#edge)" stroke-width="2"/>

  <!-- A ilha -->
  <rect x="192" y="402" width="640" height="220" rx="110" fill="#000"/>
  <rect x="192.5" y="402.5" width="639" height="219" rx="109.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Capa -->
  <rect x="262" y="452" width="120" height="120" rx="30" fill="url(#art)"/>

  <!-- Visualizador -->
  <g fill="url(#bar)">
    <rect x="602" y="487" width="26" height="50" rx="13"/>
    <rect x="648" y="452" width="26" height="120" rx="13"/>
    <rect x="694" y="472" width="26" height="80" rx="13"/>
    <rect x="740" y="497" width="26" height="30" rx="13"/>
  </g>
</svg>
